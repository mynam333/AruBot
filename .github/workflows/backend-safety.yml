name: Backend Safety

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 23 * * *'

permissions:
  contents: read

concurrency:
  group: backend-safety-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arubot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arubot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARUBOT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/arubot_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify backend build safety
        run: npm run verify:backend

  dependency-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Check newly published production advisories
        run: npm run audit:production
