name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-backend.yml'
      - '.nvmrc'
      - '.node-version'
      - 'ecosystem.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'scripts/**'

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PORT: ${{ secrets.ORACLE_PORT || '22' }}
      BACKEND_APP_DIR: ${{ vars.BACKEND_APP_DIR || '/opt/arubot' }}
      RELEASE_SHA: ${{ github.sha }}
      ARCHIVE_NAME: arubot-backend-${{ github.sha }}.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify backend build safety
        run: |
          npm run lint
          npx tsc --noEmit --pretty false --incremental false

      - name: Create backend artifact
        run: |
          set -euo pipefail

          STAGING_DIR="$RUNNER_TEMP/arubot-backend-staging"
          ARCHIVE_PATH="$RUNNER_TEMP/$ARCHIVE_NAME"

          rm -rf "$STAGING_DIR"
          rm -f "$ARCHIVE_PATH"
          mkdir -p "$STAGING_DIR"

          cp -a package.json package-lock.json ecosystem.config.cjs "$STAGING_DIR/"
          cp -a server scripts "$STAGING_DIR/"
          cp -a .nvmrc .node-version "$STAGING_DIR/"

          tar -C "$STAGING_DIR" -czf "$ARCHIVE_PATH" .
          mv "$ARCHIVE_PATH" "$ARCHIVE_NAME"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}" > ~/.ssh/arubot_deploy_key
          chmod 600 ~/.ssh/arubot_deploy_key
          ssh-keyscan -p "$ORACLE_PORT" -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifact
        run: |
          scp -P "$ORACLE_PORT" -i ~/.ssh/arubot_deploy_key "$ARCHIVE_NAME" "$ORACLE_USER@$ORACLE_HOST:/tmp/$ARCHIVE_NAME"
          rm -f "$ARCHIVE_NAME"

      - name: Deploy with PM2
        run: |
          ssh -p "$ORACLE_PORT" -i ~/.ssh/arubot_deploy_key "$ORACLE_USER@$ORACLE_HOST" \
            "APP_DIR='$BACKEND_APP_DIR' RELEASE_SHA='$RELEASE_SHA' ARCHIVE_NAME='$ARCHIVE_NAME' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR="${APP_DIR:-/opt/arubot}"
          RELEASE_SHA="${RELEASE_SHA:?RELEASE_SHA is required}"
          ARCHIVE_NAME="${ARCHIVE_NAME:?ARCHIVE_NAME is required}"

          RELEASES_DIR="$APP_DIR/releases"
          SHARED_DIR="$APP_DIR/shared"
          CURRENT_DIR="$APP_DIR/current"
          RELEASE_DIR="$RELEASES_DIR/$RELEASE_SHA"
          TMP_RELEASE_DIR="$RELEASES_DIR/.tmp-$RELEASE_SHA-$$"
          ARCHIVE_PATH="/tmp/$ARCHIVE_NAME"
          REMOTE_USER="$(id -un)"
          REMOTE_GROUP="$(id -gn)"

          cleanup() {
            rm -f "$ARCHIVE_PATH" || true
            rm -rf "$TMP_RELEASE_DIR" || true
          }
          trap cleanup EXIT

          ensure_deploy_dirs() {
            if mkdir -p "$RELEASES_DIR" "$SHARED_DIR/logs"; then
              return 0
            fi

            echo "Deploy directory is not writable by $REMOTE_USER: $APP_DIR" >&2

            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              echo "Trying to create and chown deploy directory with passwordless sudo..." >&2
              sudo mkdir -p "$RELEASES_DIR" "$SHARED_DIR/logs"
              sudo chown -R "$REMOTE_USER:$REMOTE_GROUP" "$APP_DIR"
              mkdir -p "$RELEASES_DIR" "$SHARED_DIR/logs"
              return 0
            fi

            {
              echo "Cannot prepare deploy directory."
              echo "Run these commands once on the Oracle VM, then rerun this workflow:"
              echo
              echo "  sudo mkdir -p \"$APP_DIR/shared/logs\" \"$APP_DIR/releases\""
              echo "  sudo chown -R \"$REMOTE_USER:$REMOTE_GROUP\" \"$APP_DIR\""
              echo
              echo "If BACKEND_APP_DIR is wrong, update the GitHub Actions variable BACKEND_APP_DIR."
            } >&2
            exit 1
          }

          ensure_deploy_dirs
          rm -rf "$TMP_RELEASE_DIR"
          mkdir -p "$TMP_RELEASE_DIR"

          if [ ! -f "$SHARED_DIR/.env" ]; then
            echo "Missing $SHARED_DIR/.env. Create the production backend .env before deploying." >&2
            exit 1
          fi

          tar -xzf "$ARCHIVE_PATH" -C "$TMP_RELEASE_DIR"

          ln -sfn "$SHARED_DIR/.env" "$TMP_RELEASE_DIR/.env"
          ln -sfn "$SHARED_DIR/logs" "$TMP_RELEASE_DIR/logs"

          cd "$TMP_RELEASE_DIR"
          npm ci --omit=dev

          if ! command -v pm2 >/dev/null 2>&1; then
            npm install -g pm2
          fi

          rm -rf "$RELEASE_DIR"
          mv "$TMP_RELEASE_DIR" "$RELEASE_DIR"
          ln -sfn "$RELEASE_DIR" "$CURRENT_DIR"
          cd "$CURRENT_DIR"

          pm2 startOrReload ecosystem.config.cjs --env production --update-env
          pm2 save

          find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d ! -name '.*' -printf '%T@ %p\n' \
            | sort -rn \
            | cut -d' ' -f2- \
            | tail -n +6 \
            | xargs -r rm -rf

          pm2 status arubot-api
          REMOTE

      - name: Cleanup local deployment files
        if: always()
        run: |
          rm -f "$ARCHIVE_NAME"
          rm -rf "$RUNNER_TEMP/arubot-backend-staging"
          rm -f ~/.ssh/arubot_deploy_key
