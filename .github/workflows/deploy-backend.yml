name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-backend.yml'
      - '.nvmrc'
      - '.node-version'
      - 'ecosystem.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'scripts/**'
      - 'tests/**'

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arubot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arubot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PORT: ${{ secrets.ORACLE_PORT || '22' }}
      BACKEND_APP_DIR: /home/ubuntu/AruBot
      RELEASE_SHA: ${{ github.sha }}
      ARCHIVE_NAME: arubot-backend-${{ github.sha }}.tar.gz
      NODE_VERSION: '22'
      REMOTE_NODE_BIN_DIR: ${{ vars.REMOTE_NODE_BIN_DIR || '' }}
      BACKEND_RELEASES_TO_KEEP: ${{ vars.BACKEND_RELEASES_TO_KEEP || '2' }}
      ARUBOT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/arubot_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify backend build safety
        run: |
          npm run audit:production
          npm run lint
          npx tsc --noEmit --pretty false --incremental false
          npm test -- --runInBand
          npm run build

      - name: Create backend artifact
        run: |
          set -euo pipefail

          STAGING_DIR="$RUNNER_TEMP/arubot-backend-staging"
          ARCHIVE_PATH="$RUNNER_TEMP/$ARCHIVE_NAME"

          rm -rf "$STAGING_DIR"
          rm -f "$ARCHIVE_PATH"
          mkdir -p "$STAGING_DIR"

          cp -a package.json package-lock.json ecosystem.config.cjs "$STAGING_DIR/"
          cp -a server scripts "$STAGING_DIR/"
          cp -a .nvmrc .node-version "$STAGING_DIR/"

          tar -C "$STAGING_DIR" -czf "$ARCHIVE_PATH" .
          mv "$ARCHIVE_PATH" "$ARCHIVE_NAME"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}" > ~/.ssh/arubot_deploy_key
          chmod 600 ~/.ssh/arubot_deploy_key
          ssh-keyscan -p "$ORACLE_PORT" -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifact
        run: |
          scp -P "$ORACLE_PORT" -i ~/.ssh/arubot_deploy_key "$ARCHIVE_NAME" "$ORACLE_USER@$ORACLE_HOST:/tmp/$ARCHIVE_NAME"
          rm -f "$ARCHIVE_NAME"

      - name: Deploy with PM2
        run: |
          ssh -p "$ORACLE_PORT" -i ~/.ssh/arubot_deploy_key "$ORACLE_USER@$ORACLE_HOST" \
            "APP_DIR='$BACKEND_APP_DIR' RELEASE_SHA='$RELEASE_SHA' ARCHIVE_NAME='$ARCHIVE_NAME' NODE_VERSION='$NODE_VERSION' REMOTE_NODE_BIN_DIR='$REMOTE_NODE_BIN_DIR' RELEASES_TO_KEEP='$BACKEND_RELEASES_TO_KEEP' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR="${APP_DIR:-/home/ubuntu/AruBot}"
          RELEASE_SHA="${RELEASE_SHA:?RELEASE_SHA is required}"
          ARCHIVE_NAME="${ARCHIVE_NAME:?ARCHIVE_NAME is required}"
          NODE_VERSION="${NODE_VERSION:-22}"
          REMOTE_NODE_BIN_DIR="${REMOTE_NODE_BIN_DIR:-}"
          RELEASES_TO_KEEP="${RELEASES_TO_KEEP:-2}"

          RELEASES_DIR="$APP_DIR/releases"
          SHARED_DIR="$APP_DIR/shared"
          CURRENT_DIR="$APP_DIR/current"
          RELEASE_ID="${RELEASE_SHA}-$(date -u +%Y%m%d%H%M%S)-$$"
          RELEASE_DIR="$RELEASES_DIR/$RELEASE_ID"
          TMP_RELEASE_DIR="$RELEASES_DIR/.tmp-$RELEASE_SHA-$$"
          NEXT_CURRENT_LINK="$APP_DIR/.next-current-$RELEASE_SHA-$$"
          ARCHIVE_PATH="/tmp/$ARCHIVE_NAME"
          REMOTE_USER="$(id -un)"
          REMOTE_GROUP="$(id -gn)"
          PREVIOUS_CURRENT_REAL="$(readlink -f "$CURRENT_DIR" 2>/dev/null || true)"

          cleanup() {
            rm -f "$ARCHIVE_PATH" || true
            rm -rf "$TMP_RELEASE_DIR" || true
            rm -f "$NEXT_CURRENT_LINK" || true
          }
          trap cleanup EXIT

          verify_log_dir_writable() {
            local probe="$SHARED_DIR/logs/.arubot-write-probe-$$"
            if ! (umask 077 && : > "$probe"); then
              return 1
            fi
            rm -f "$probe"
            for log_file in "$SHARED_DIR/logs/api.out.log" "$SHARED_DIR/logs/api.err.log"; do
              if [ -e "$log_file" ] && [ ! -w "$log_file" ]; then
                echo "Existing log file is not writable by $REMOTE_USER: $log_file" >&2
                return 1
              fi
            done
            return 0
          }

          ensure_deploy_dirs() {
            if mkdir -p "$RELEASES_DIR" "$SHARED_DIR/logs" && verify_log_dir_writable; then
              return 0
            fi

            echo "Deploy directory is not writable by $REMOTE_USER: $APP_DIR" >&2

            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              echo "Trying to create and chown deploy directory with passwordless sudo..." >&2
              sudo mkdir -p "$RELEASES_DIR" "$SHARED_DIR/logs"
              sudo chown -R "$REMOTE_USER:$REMOTE_GROUP" "$APP_DIR"
              mkdir -p "$RELEASES_DIR" "$SHARED_DIR/logs"
              verify_log_dir_writable
              return
            fi

            {
              echo "Cannot prepare deploy directory."
              echo "Run these commands once on the Oracle VM, then rerun this workflow:"
              echo
              echo "  sudo mkdir -p \"$APP_DIR/shared/logs\" \"$APP_DIR/releases\""
              echo "  sudo chown -R \"$REMOTE_USER:$REMOTE_GROUP\" \"$APP_DIR\""
              echo
              echo "If BACKEND_APP_DIR is wrong, update the GitHub Actions variable BACKEND_APP_DIR."
            } >&2
            exit 1
          }

          load_node_runtime() {
            for profile in /etc/profile "$HOME/.profile" "$HOME/.bash_profile" "$HOME/.bashrc"; do
              if [ -r "$profile" ]; then
                # shellcheck disable=SC1090
                set +e +u
                . "$profile" >/dev/null 2>&1 || true
                set -euo pipefail
              fi
            done

            if [ -n "$REMOTE_NODE_BIN_DIR" ]; then
              export PATH="$REMOTE_NODE_BIN_DIR:$PATH"
            fi

            export PATH="$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/.volta/bin:$HOME/.asdf/shims:$HOME/.asdf/bin:/usr/local/bin:/usr/bin:/bin:/snap/bin:$PATH"
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
              nvm use "$NODE_VERSION" >/dev/null 2>&1 || nvm install "$NODE_VERSION" >/dev/null 2>&1 || true
            fi

            for node_bin_dir in "$HOME/.nvm/versions/node/v$NODE_VERSION/bin" "$HOME/.nvm/versions/node/v$NODE_VERSION."*/bin "$HOME/.local/share/fnm/node-versions/v$NODE_VERSION"*/installation/bin "$HOME/.fnm/node-versions/v$NODE_VERSION"*/installation/bin /usr/local/node/bin /opt/node/bin /opt/nodejs/bin; do
              if [ -d "$node_bin_dir" ]; then
                export PATH="$node_bin_dir:$PATH"
              fi
            done

            if ! command -v npm >/dev/null 2>&1 || ! command -v node >/dev/null 2>&1; then
              {
                echo "Node.js/npm is not available in this non-interactive SSH session."
                echo "Install Node.js $NODE_VERSION for the SSH deploy user, or set GitHub Actions variable REMOTE_NODE_BIN_DIR to the directory that contains node and npm."
                echo
                echo "Quick diagnosis on the Oracle VM:"
                echo "  whoami"
                echo "  command -v node || true"
                echo "  command -v npm || true"
                echo "  find \"\$HOME\" /usr/local /usr /opt -path '*/bin/npm' -type f 2>/dev/null | head -20"
                echo
                echo "Recommended one-time setup:"
                echo "  curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash"
                echo "  export NVM_DIR=\"\$HOME/.nvm\""
                echo "  . \"\$NVM_DIR/nvm.sh\""
                echo "  nvm install $NODE_VERSION"
                echo "  nvm alias default $NODE_VERSION"
                echo "  npm install -g pm2"
                echo
                echo "If npm is already installed somewhere else, set REMOTE_NODE_BIN_DIR to that bin directory."
              } >&2
              exit 127
            fi

            echo "Using node: $(command -v node) ($(node -v))"
            echo "Using npm: $(command -v npm) ($(npm -v))"
          }

          ensure_native_build_tools() {
            local missing_tools=()

            if ! command -v make >/dev/null 2>&1; then
              missing_tools+=("make")
            fi
            if ! command -v python3 >/dev/null 2>&1; then
              missing_tools+=("python3")
            fi
            if ! command -v g++ >/dev/null 2>&1 && ! command -v c++ >/dev/null 2>&1 && ! command -v clang++ >/dev/null 2>&1; then
              missing_tools+=("g++")
            fi

            if [ "${#missing_tools[@]}" -eq 0 ]; then
              return 0
            fi

            echo "Missing native build tools for better-sqlite3: ${missing_tools[*]}" >&2

            if ! command -v sudo >/dev/null 2>&1 || ! sudo -n true 2>/dev/null; then
              {
                echo "Cannot install native build tools because passwordless sudo is unavailable."
                echo "Run one of these commands once on the Oracle VM, then rerun this workflow:"
                echo
                echo "  sudo apt-get update && sudo apt-get install -y build-essential python3"
                echo "  sudo dnf install -y make gcc gcc-c++ python3"
                echo "  sudo yum install -y make gcc gcc-c++ python3"
              } >&2
              exit 127
            fi

            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential python3
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y make gcc gcc-c++ python3
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y make gcc gcc-c++ python3
            elif command -v apk >/dev/null 2>&1; then
              sudo apk add --no-cache make gcc g++ python3
            else
              {
                echo "Unsupported package manager. Install make, a C++ compiler, and python3 manually."
                echo "Detected missing tools: ${missing_tools[*]}"
              } >&2
              exit 127
            fi
          }

          switch_current_release() {
            rm -f "$NEXT_CURRENT_LINK"
            ln -s "$RELEASE_DIR" "$NEXT_CURRENT_LINK"

            if [ -L "$CURRENT_DIR" ] || [ ! -e "$CURRENT_DIR" ]; then
              mv -Tf "$NEXT_CURRENT_LINK" "$CURRENT_DIR"
            elif [ -d "$CURRENT_DIR" ]; then
              LEGACY_CURRENT_DIR="$RELEASES_DIR/legacy-current-$(date +%Y%m%d%H%M%S)"
              echo "Current path is a regular directory, not a symlink. Moving it to $LEGACY_CURRENT_DIR before switching release." >&2
              mv "$CURRENT_DIR" "$LEGACY_CURRENT_DIR"
              if [ "$PREVIOUS_CURRENT_REAL" = "$CURRENT_DIR" ]; then
                PREVIOUS_CURRENT_REAL="$LEGACY_CURRENT_DIR"
              fi
              mv -T "$NEXT_CURRENT_LINK" "$CURRENT_DIR"
            else
              rm -f "$CURRENT_DIR"
              mv -T "$NEXT_CURRENT_LINK" "$CURRENT_DIR"
            fi

            CURRENT_REAL="$(readlink -f "$CURRENT_DIR" || true)"
            RELEASE_REAL="$(readlink -f "$RELEASE_DIR" || true)"
            if [ -z "$CURRENT_REAL" ] || [ "$CURRENT_REAL" != "$RELEASE_REAL" ]; then
              echo "Release switch failed: current=$CURRENT_REAL expected=$RELEASE_REAL" >&2
              exit 1
            fi

            echo "Activated release: $CURRENT_REAL"
          }

          point_current_to() {
            local target_dir="$1"
            local next_link="$APP_DIR/.next-current-rollback-$$"
            rm -f "$next_link"
            ln -s "$target_dir" "$next_link"
            mv -Tf "$next_link" "$CURRENT_DIR"
          }

          start_release() {
            local release_dir="$1"
            local release_sha="$2"
            local stable_cwd="/home/ubuntu/AruBot/current"
            local current_real
            local release_real

            current_real="$(readlink -f "$stable_cwd" || true)"
            release_real="$(readlink -f "$release_dir" || true)"
            if [ -z "$current_real" ] || [ "$current_real" != "$release_real" ]; then
              echo "Refusing to start PM2 from an unexpected release: current=$current_real expected=$release_real" >&2
              return 1
            fi

            local logs_real
            local expected_logs_real
            logs_real="$(readlink -f "$stable_cwd/logs" || true)"
            expected_logs_real="$(readlink -f "$APP_DIR/shared/logs" || true)"
            if [ -z "$logs_real" ] || [ "$logs_real" != "$expected_logs_real" ]; then
              echo "Refusing to start PM2 with an unexpected log directory: actual=$logs_real expected=$expected_logs_real" >&2
              return 1
            fi

            cd "$stable_cwd"
            export ARUBOT_APP_CWD="$stable_cwd"
            export ARUBOT_RELEASE_SHA="$release_sha"
            # startOrReload can retain a previous release's absolute cwd and script path.
            # Recreate this single process so deployments and rollbacks always use current.
            pm2 delete arubot-api >/dev/null 2>&1 || true
            pm2 start ecosystem.config.cjs --env production --update-env
          }

          wait_for_release() {
            local release_sha="$1"
            local attempt
            for attempt in $(seq 1 30); do
              if npm run api:smoke -- --expect-release="$release_sha" --timeout-ms=5000; then
                echo "Backend release passed API health/readiness checks: $release_sha"
                return 0
              fi
              echo "Waiting for backend release $release_sha ($attempt/30)..." >&2
              sleep 2
            done
            return 1
          }

          rollback_release() {
            if [ -z "$PREVIOUS_CURRENT_REAL" ] || [ ! -d "$PREVIOUS_CURRENT_REAL" ]; then
              echo "No previous backend release is available for rollback." >&2
              pm2 delete arubot-api >/dev/null 2>&1 || true
              return 1
            fi

            local previous_sha
            if [ -s "$PREVIOUS_CURRENT_REAL/.release-sha" ]; then
              previous_sha="$(tr -d '\r\n' < "$PREVIOUS_CURRENT_REAL/.release-sha")"
            else
              previous_sha="$(basename "$PREVIOUS_CURRENT_REAL")"
            fi
            echo "Rolling back backend to $PREVIOUS_CURRENT_REAL" >&2
            point_current_to "$PREVIOUS_CURRENT_REAL"
            if ! start_release "$PREVIOUS_CURRENT_REAL" "$previous_sha"; then
              echo "Rollback process failed to start." >&2
              return 1
            fi
            if ! wait_for_release "$previous_sha"; then
              echo "Rollback release failed API health/readiness checks." >&2
              return 1
            fi
            pm2 save
            echo "Rollback completed successfully: $previous_sha" >&2
            return 0
          }

          cleanup_old_releases() {
            if ! [[ "$RELEASES_TO_KEEP" =~ ^[0-9]+$ ]]; then
              echo "Invalid RELEASES_TO_KEEP value '$RELEASES_TO_KEEP'. Falling back to 2." >&2
              RELEASES_TO_KEEP=2
            fi

            if [ "$RELEASES_TO_KEEP" -lt 2 ]; then
              RELEASES_TO_KEEP=2
            fi

            CURRENT_REAL="$(readlink -f "$CURRENT_DIR" || true)"
            RELEASE_REAL="$(readlink -f "$RELEASE_DIR" || true)"
            kept=0
            removed=0

            echo "Cleaning backend releases in $RELEASES_DIR. Keeping $RELEASES_TO_KEEP release(s)."

            find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d -name '.tmp-*' -mmin +60 -print -exec rm -rf -- {} +

            while IFS= read -r release_path; do
              if [ -z "$release_path" ]; then
                continue
              fi

              release_real="$(readlink -f "$release_path" || true)"
              if [ -n "$CURRENT_REAL" ] && [ "$release_real" = "$CURRENT_REAL" ]; then
                kept=$((kept + 1))
                echo "Keeping active backend release: $release_path"
                continue
              fi

              if [ -n "$RELEASE_REAL" ] && [ "$release_real" = "$RELEASE_REAL" ]; then
                kept=$((kept + 1))
                echo "Keeping deployed backend release: $release_path"
                continue
              fi

              if [ "$kept" -lt "$RELEASES_TO_KEEP" ]; then
                kept=$((kept + 1))
                echo "Keeping recent backend release: $release_path"
                continue
              fi

              echo "Removing old backend release: $release_path"
              rm -rf -- "$release_path"
              removed=$((removed + 1))
            done < <(
              find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d ! -name '.*' -printf '%T@ %p\n' \
                | sort -rn \
                | cut -d' ' -f2-
            )

            echo "Backend release cleanup complete: removed $removed old release(s)."
          }

          ensure_deploy_dirs
          rm -rf "$TMP_RELEASE_DIR"
          mkdir -p "$TMP_RELEASE_DIR"

          if [ ! -f "$SHARED_DIR/.env" ]; then
            echo "Missing $SHARED_DIR/.env. Create the production backend .env before deploying." >&2
            exit 1
          fi

          tar -xzf "$ARCHIVE_PATH" -C "$TMP_RELEASE_DIR"

          ln -sfn "$SHARED_DIR/.env" "$TMP_RELEASE_DIR/.env"
          ln -sfn "$SHARED_DIR/logs" "$TMP_RELEASE_DIR/logs"

          cd "$TMP_RELEASE_DIR"
          load_node_runtime
          ensure_native_build_tools
          npm ci --omit=dev
          npm run db:migrate
          npm run db:provider-smoke

          if ! command -v pm2 >/dev/null 2>&1; then
            npm install -g pm2 || {
              if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
                sudo env "PATH=$PATH" npm install -g pm2
              else
                echo "PM2 is not installed and npm global install failed. Install PM2 once on the Oracle VM: npm install -g pm2" >&2
                exit 127
              fi
            }
          fi

          rm -rf "$RELEASE_DIR"
          mv "$TMP_RELEASE_DIR" "$RELEASE_DIR"
          printf '%s\n' "$RELEASE_SHA" > "$RELEASE_DIR/.release-sha"
          switch_current_release

          if ! start_release "$RELEASE_DIR" "$RELEASE_SHA" || ! wait_for_release "$RELEASE_SHA"; then
            echo "Backend candidate failed to start or pass API health/readiness checks." >&2
            rollback_release || echo "Automatic rollback failed; operator intervention is required." >&2
            exit 1
          fi

          pm2 save

          cleanup_old_releases

          pm2 status arubot-api
          pm2 describe arubot-api
          REMOTE

      - name: Cleanup local deployment files
        if: always()
        run: |
          rm -f "$ARCHIVE_NAME"
          rm -rf "$RUNNER_TEMP/arubot-backend-staging"
          rm -f ~/.ssh/arubot_deploy_key
