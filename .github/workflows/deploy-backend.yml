name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-backend.yml'
      - '.nvmrc'
      - '.node-version'
      - 'ecosystem.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'scripts/**'

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PORT: ${{ secrets.ORACLE_PORT || '22' }}
      BACKEND_APP_DIR: ${{ vars.BACKEND_APP_DIR || '/opt/arubot' }}
      RELEASE_SHA: ${{ github.sha }}
      ARCHIVE_NAME: arubot-backend-${{ github.sha }}.tar.gz
      NODE_VERSION: '22'
      REMOTE_NODE_BIN_DIR: ${{ vars.REMOTE_NODE_BIN_DIR || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify backend build safety
        run: |
          npm run lint
          npx tsc --noEmit --pretty false --incremental false

      - name: Create backend artifact
        run: |
          set -euo pipefail

          STAGING_DIR="$RUNNER_TEMP/arubot-backend-staging"
          ARCHIVE_PATH="$RUNNER_TEMP/$ARCHIVE_NAME"

          rm -rf "$STAGING_DIR"
          rm -f "$ARCHIVE_PATH"
          mkdir -p "$STAGING_DIR"

          cp -a package.json package-lock.json ecosystem.config.cjs "$STAGING_DIR/"
          cp -a server scripts "$STAGING_DIR/"
          cp -a .nvmrc .node-version "$STAGING_DIR/"

          tar -C "$STAGING_DIR" -czf "$ARCHIVE_PATH" .
          mv "$ARCHIVE_PATH" "$ARCHIVE_NAME"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}" > ~/.ssh/arubot_deploy_key
          chmod 600 ~/.ssh/arubot_deploy_key
          ssh-keyscan -p "$ORACLE_PORT" -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifact
        run: |
          scp -P "$ORACLE_PORT" -i ~/.ssh/arubot_deploy_key "$ARCHIVE_NAME" "$ORACLE_USER@$ORACLE_HOST:/tmp/$ARCHIVE_NAME"
          rm -f "$ARCHIVE_NAME"

      - name: Deploy with PM2
        run: |
          ssh -p "$ORACLE_PORT" -i ~/.ssh/arubot_deploy_key "$ORACLE_USER@$ORACLE_HOST" \
            "APP_DIR='$BACKEND_APP_DIR' RELEASE_SHA='$RELEASE_SHA' ARCHIVE_NAME='$ARCHIVE_NAME' NODE_VERSION='$NODE_VERSION' REMOTE_NODE_BIN_DIR='$REMOTE_NODE_BIN_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR="${APP_DIR:-/opt/arubot}"
          RELEASE_SHA="${RELEASE_SHA:?RELEASE_SHA is required}"
          ARCHIVE_NAME="${ARCHIVE_NAME:?ARCHIVE_NAME is required}"
          NODE_VERSION="${NODE_VERSION:-22}"
          REMOTE_NODE_BIN_DIR="${REMOTE_NODE_BIN_DIR:-}"

          RELEASES_DIR="$APP_DIR/releases"
          SHARED_DIR="$APP_DIR/shared"
          CURRENT_DIR="$APP_DIR/current"
          RELEASE_DIR="$RELEASES_DIR/$RELEASE_SHA"
          TMP_RELEASE_DIR="$RELEASES_DIR/.tmp-$RELEASE_SHA-$$"
          NEXT_CURRENT_LINK="$APP_DIR/.next-current-$RELEASE_SHA-$$"
          ARCHIVE_PATH="/tmp/$ARCHIVE_NAME"
          REMOTE_USER="$(id -un)"
          REMOTE_GROUP="$(id -gn)"

          cleanup() {
            rm -f "$ARCHIVE_PATH" || true
            rm -rf "$TMP_RELEASE_DIR" || true
            rm -f "$NEXT_CURRENT_LINK" || true
          }
          trap cleanup EXIT

          ensure_deploy_dirs() {
            if mkdir -p "$RELEASES_DIR" "$SHARED_DIR/logs"; then
              return 0
            fi

            echo "Deploy directory is not writable by $REMOTE_USER: $APP_DIR" >&2

            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              echo "Trying to create and chown deploy directory with passwordless sudo..." >&2
              sudo mkdir -p "$RELEASES_DIR" "$SHARED_DIR/logs"
              sudo chown -R "$REMOTE_USER:$REMOTE_GROUP" "$APP_DIR"
              mkdir -p "$RELEASES_DIR" "$SHARED_DIR/logs"
              return 0
            fi

            {
              echo "Cannot prepare deploy directory."
              echo "Run these commands once on the Oracle VM, then rerun this workflow:"
              echo
              echo "  sudo mkdir -p \"$APP_DIR/shared/logs\" \"$APP_DIR/releases\""
              echo "  sudo chown -R \"$REMOTE_USER:$REMOTE_GROUP\" \"$APP_DIR\""
              echo
              echo "If BACKEND_APP_DIR is wrong, update the GitHub Actions variable BACKEND_APP_DIR."
            } >&2
            exit 1
          }

          load_node_runtime() {
            for profile in /etc/profile "$HOME/.profile" "$HOME/.bash_profile" "$HOME/.bashrc"; do
              if [ -r "$profile" ]; then
                # shellcheck disable=SC1090
                set +e +u
                . "$profile" >/dev/null 2>&1 || true
                set -euo pipefail
              fi
            done

            if [ -n "$REMOTE_NODE_BIN_DIR" ]; then
              export PATH="$REMOTE_NODE_BIN_DIR:$PATH"
            fi

            export PATH="$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/.volta/bin:$HOME/.asdf/shims:$HOME/.asdf/bin:/usr/local/bin:/usr/bin:/bin:/snap/bin:$PATH"
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
              nvm use "$NODE_VERSION" >/dev/null 2>&1 || nvm install "$NODE_VERSION" >/dev/null 2>&1 || true
            fi

            for node_bin_dir in "$HOME/.nvm/versions/node/v$NODE_VERSION/bin" "$HOME/.nvm/versions/node/v$NODE_VERSION."*/bin "$HOME/.local/share/fnm/node-versions/v$NODE_VERSION"*/installation/bin "$HOME/.fnm/node-versions/v$NODE_VERSION"*/installation/bin /usr/local/node/bin /opt/node/bin /opt/nodejs/bin; do
              if [ -d "$node_bin_dir" ]; then
                export PATH="$node_bin_dir:$PATH"
              fi
            done

            if ! command -v npm >/dev/null 2>&1 || ! command -v node >/dev/null 2>&1; then
              {
                echo "Node.js/npm is not available in this non-interactive SSH session."
                echo "Install Node.js $NODE_VERSION for the SSH deploy user, or set GitHub Actions variable REMOTE_NODE_BIN_DIR to the directory that contains node and npm."
                echo
                echo "Quick diagnosis on the Oracle VM:"
                echo "  whoami"
                echo "  command -v node || true"
                echo "  command -v npm || true"
                echo "  find \"\$HOME\" /usr/local /usr /opt -path '*/bin/npm' -type f 2>/dev/null | head -20"
                echo
                echo "Recommended one-time setup:"
                echo "  curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash"
                echo "  export NVM_DIR=\"\$HOME/.nvm\""
                echo "  . \"\$NVM_DIR/nvm.sh\""
                echo "  nvm install $NODE_VERSION"
                echo "  nvm alias default $NODE_VERSION"
                echo "  npm install -g pm2"
                echo
                echo "If npm is already installed somewhere else, set REMOTE_NODE_BIN_DIR to that bin directory."
              } >&2
              exit 127
            fi

            echo "Using node: $(command -v node) ($(node -v))"
            echo "Using npm: $(command -v npm) ($(npm -v))"
          }

          ensure_native_build_tools() {
            local missing_tools=()

            if ! command -v make >/dev/null 2>&1; then
              missing_tools+=("make")
            fi
            if ! command -v python3 >/dev/null 2>&1; then
              missing_tools+=("python3")
            fi
            if ! command -v g++ >/dev/null 2>&1 && ! command -v c++ >/dev/null 2>&1 && ! command -v clang++ >/dev/null 2>&1; then
              missing_tools+=("g++")
            fi

            if [ "${#missing_tools[@]}" -eq 0 ]; then
              return 0
            fi

            echo "Missing native build tools for better-sqlite3: ${missing_tools[*]}" >&2

            if ! command -v sudo >/dev/null 2>&1 || ! sudo -n true 2>/dev/null; then
              {
                echo "Cannot install native build tools because passwordless sudo is unavailable."
                echo "Run one of these commands once on the Oracle VM, then rerun this workflow:"
                echo
                echo "  sudo apt-get update && sudo apt-get install -y build-essential python3"
                echo "  sudo dnf install -y make gcc gcc-c++ python3"
                echo "  sudo yum install -y make gcc gcc-c++ python3"
              } >&2
              exit 127
            fi

            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential python3
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y make gcc gcc-c++ python3
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y make gcc gcc-c++ python3
            elif command -v apk >/dev/null 2>&1; then
              sudo apk add --no-cache make gcc g++ python3
            else
              {
                echo "Unsupported package manager. Install make, a C++ compiler, and python3 manually."
                echo "Detected missing tools: ${missing_tools[*]}"
              } >&2
              exit 127
            fi
          }

          switch_current_release() {
            rm -f "$NEXT_CURRENT_LINK"
            ln -s "$RELEASE_DIR" "$NEXT_CURRENT_LINK"

            if [ -L "$CURRENT_DIR" ] || [ ! -e "$CURRENT_DIR" ]; then
              mv -Tf "$NEXT_CURRENT_LINK" "$CURRENT_DIR"
            elif [ -d "$CURRENT_DIR" ]; then
              LEGACY_CURRENT_DIR="$RELEASES_DIR/legacy-current-$(date +%Y%m%d%H%M%S)"
              echo "Current path is a regular directory, not a symlink. Moving it to $LEGACY_CURRENT_DIR before switching release." >&2
              mv "$CURRENT_DIR" "$LEGACY_CURRENT_DIR"
              mv -T "$NEXT_CURRENT_LINK" "$CURRENT_DIR"
            else
              rm -f "$CURRENT_DIR"
              mv -T "$NEXT_CURRENT_LINK" "$CURRENT_DIR"
            fi

            CURRENT_REAL="$(readlink -f "$CURRENT_DIR" || true)"
            RELEASE_REAL="$(readlink -f "$RELEASE_DIR" || true)"
            if [ -z "$CURRENT_REAL" ] || [ "$CURRENT_REAL" != "$RELEASE_REAL" ]; then
              echo "Release switch failed: current=$CURRENT_REAL expected=$RELEASE_REAL" >&2
              exit 1
            fi

            echo "Activated release: $CURRENT_REAL"
          }

          ensure_deploy_dirs
          rm -rf "$TMP_RELEASE_DIR"
          mkdir -p "$TMP_RELEASE_DIR"

          if [ ! -f "$SHARED_DIR/.env" ]; then
            echo "Missing $SHARED_DIR/.env. Create the production backend .env before deploying." >&2
            exit 1
          fi

          tar -xzf "$ARCHIVE_PATH" -C "$TMP_RELEASE_DIR"

          ln -sfn "$SHARED_DIR/.env" "$TMP_RELEASE_DIR/.env"
          ln -sfn "$SHARED_DIR/logs" "$TMP_RELEASE_DIR/logs"

          cd "$TMP_RELEASE_DIR"
          load_node_runtime
          ensure_native_build_tools
          npm ci --omit=dev

          if ! command -v pm2 >/dev/null 2>&1; then
            npm install -g pm2 || {
              if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
                sudo env "PATH=$PATH" npm install -g pm2
              else
                echo "PM2 is not installed and npm global install failed. Install PM2 once on the Oracle VM: npm install -g pm2" >&2
                exit 127
              fi
            }
          fi

          rm -rf "$RELEASE_DIR"
          mv "$TMP_RELEASE_DIR" "$RELEASE_DIR"
          switch_current_release
          cd "$CURRENT_DIR"

          export ARUBOT_RELEASE_SHA="$RELEASE_SHA"
          pm2 delete arubot-api >/dev/null 2>&1 || true
          pm2 start ecosystem.config.cjs --env production --update-env
          pm2 save

          find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d ! -name '.*' -printf '%T@ %p\n' \
            | sort -rn \
            | cut -d' ' -f2- \
            | tail -n +6 \
            | xargs -r rm -rf

          pm2 status arubot-api
          pm2 describe arubot-api
          REMOTE

      - name: Cleanup local deployment files
        if: always()
        run: |
          rm -f "$ARCHIVE_NAME"
          rm -rf "$RUNNER_TEMP/arubot-backend-staging"
          rm -f ~/.ssh/arubot_deploy_key
