<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>후원시 유튜브 일시정지</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>후원시 유튜브 일시정지</h1>
          <p id="summary">Loading</p>
        </div>
        <label class="switch" title="Monitoring">
          <input id="monitoring" type="checkbox" />
          <span></span>
        </label>
      </header>

      <section class="hero">
        <span class="eyebrow">YouTube paused</span>
        <strong id="remaining">00:00</strong>
        <div class="meter"><span id="meterFill"></span></div>
      </section>

      <section class="services" id="services"></section>

      <footer class="actions">
        <button id="testPause" type="button">10s test</button>
        <button id="clearPause" type="button">Resume</button>
        <button id="openOptions" type="button" class="primary">Overlay URLs</button>
      </footer>
      <nav class="links" aria-label="관련 링크">
        <a href="https://arubot.yuaru.com" target="_blank" rel="noreferrer">AruBot</a>
        <a href="https://x.com/Chzzk_YuAru" target="_blank" rel="noreferrer">개발자 X</a>
      </nav>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
