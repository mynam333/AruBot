<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AruBot 영상 후원 제어</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <img src="icons/icon-32.png" alt="" />
          <div>
            <h1>영상 후원 제어</h1>
            <p id="summary">상태 확인 중</p>
          </div>
        </div>
        <label class="switch" title="후원 감지">
          <input id="monitoring" type="checkbox" />
          <span></span>
        </label>
      </header>

      <section class="hero">
        <span class="eyebrow">YouTube 일시정지 남은 시간</span>
        <strong id="remaining">00:00</strong>
        <div class="meter"><span id="meterFill"></span></div>
      </section>

      <section class="services" id="services"></section>

      <footer class="actions">
        <button id="testPause" type="button">10초 테스트</button>
        <button id="clearPause" type="button">즉시 재생</button>
        <button id="openOptions" type="button" class="primary">연결 설정</button>
      </footer>
      <nav class="links" aria-label="관련 링크">
        <a href="https://arubot.yuaru.com" target="_blank" rel="noreferrer">AruBot</a>
        <a href="https://x.com/Chzzk_YuAru" target="_blank" rel="noreferrer">개발자 X</a>
      </nav>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
